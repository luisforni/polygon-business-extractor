services:

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: dev
    ports:
      - "3100:3100"
    environment:
      NEXT_PUBLIC_API_URL: http://api:8300
    volumes:
      - ./packages/frontend/src:/app/packages/frontend/src
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./packages/extractor-api
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8300:8300"
    env_file:
      - path: ./packages/extractor-api/.env
        required: false          # no falla si el archivo no existe
    environment:
      # Defaults que funcionan sin ningún .env
      ENABLED_PROVIDERS: ${ENABLED_PROVIDERS:-overpass}
      CORS_ORIGINS: http://localhost:3100
      DATABASE_URL: sqlite:////app/data/searches.db
      # Keys opcionales — definirlas en packages/extractor-api/.env para activar el provider
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY:-}
      FOURSQUARE_API_KEY: ${FOURSQUARE_API_KEY:-}
      YELP_API_KEY: ${YELP_API_KEY:-}
    volumes:
      - ./packages/extractor-api/app:/app/app
      - searches_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8300/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

volumes:
  searches_data:

services:

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      target: dev
    ports:
      - "3100:3100"
    environment:
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      NEXT_PUBLIC_API_URL: http://api:8300
    volumes:
      # Hot reload: mount source, exclude node_modules
      - ./packages/frontend/src:/app/packages/frontend/src
      - ./packages/frontend/public:/app/packages/frontend/public
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  api:
    build:
      context: ./packages/extractor-api
      dockerfile: Dockerfile
      target: dev
    ports:
      - "8300:8300"
    env_file:
      - ./packages/extractor-api/.env
    environment:
      CORS_ORIGINS: http://localhost:3100
    volumes:
      # Hot reload: uvicorn --reload watches this
      - ./packages/extractor-api/app:/app/app
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8300/health').raise_for_status()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped
